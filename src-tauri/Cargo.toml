[package]
name = "bolum"
version = "0.1.0"
description = "Push-to-talk dictation with local Whisper and NVIDIA ONNX engines"
authors = ["shivraj598"]
edition = "2021"
rust-version = "1.92"

[lib]
name = "bolum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
cpal = "0.18"
hound = "3.5"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.11"
whisper-rs = "0.16"
ort = { version = "=2.0.0-rc.14", features = ["download-binaries"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native key events through CGEvent; macOS has no wtype/xdotool equivalent.
enigo = { version = "0.6", default-features = false }
# Run whisper.cpp on the Apple GPU.
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
# Builds the `reqwest::Response` values the resume tests check.
http = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

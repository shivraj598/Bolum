[package]
name = "bolum"
version = "0.1.0"
description = "Push-to-talk dictation with local Whisper and NVIDIA ONNX engines"
authors = ["shivraj598"]
edition = "2021"
rust-version = "1.92"

[lib]
name = "bolum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true

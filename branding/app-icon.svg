<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source for every app icon size; run `npm run icons` after editing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a48bff" />
      <stop offset="1" stop-color="#5a2ad9" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2a1170" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 px squircle centred on the 1024 px canvas. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)" />
  <g transform="translate(217.6 252.8) scale(6.4)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M67.2 21.4A32 27 0 0 0 10 38A32 27 0 0 0 14.3 51.5L12 70L28.5 62.5A32 27 0 0 0 67.2 54.6" stroke-width="7" />
    <path d="M33 34.5v7M48 34.5v7" stroke-width="9" />
    <path d="M71 29v18M83 21v34" stroke-width="6.5" />
  </g>
</svg>

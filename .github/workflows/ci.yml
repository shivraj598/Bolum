name: CI/CD

# Every push and pull request runs the whole test suite on macOS, Linux and
# Windows. When a push to main or a v* tag passes every test, the installers
# are built and published:
#   main → the rolling "latest" release, marked Latest on GitHub
#   v*   → a permanent release for that version
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request supersedes its old run; runs that publish always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Test · web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Test · Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # tauri::generate_context! embeds dist/, so the web build comes first.
      - run: npm ci
      - run: npm run build
      - run: npm run lint:rust
      - run: npm run test:rust

  smoke:
    name: Test · smoke (download, verify, transcribe)
    needs: [web, rust]
    # Talks to Hugging Face, so it runs on pushes rather than on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke
        env:
          BOLUM_SMOKE_DIR: ${{ runner.temp }}/bolum-smoke

  bundle:
    name: Build · ${{ matrix.name }}
    needs: [web, rust, smoke]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS dmg (Apple Silicon)
            os: macos-latest
            bundles: dmg
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows exe (x64)
            os: windows-latest
            bundles: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          # ONNX Runtime's prebuilt libraries need glibc 2.38+, hence 24.04.
          - name: Linux AppImage and deb (x86_64)
            os: ubuntu-24.04
            bundles: appimage,deb
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake patchelf file libfuse2t64 libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: bundle
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish · ${{ github.ref_type == 'tag' && github.ref_name || 'latest build' }}
    needs: bundle
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true
      # The Linux artifact keeps its appimage/ and deb/ folders; releases want flat files.
      - name: Collect installers and write checksums
        run: |
          mkdir release
          find artifacts -type f -exec mv {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the version release
        if: github.ref_type == 'tag'
        run: |
          tag="$GITHUB_REF_NAME"
          notes=".github/release-notes/$tag.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --verify-tag --title "Bolum ${tag#v}" --latest "$@"
          fi

      - name: Publish the latest build
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./package.json').version")
          commit="https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          run="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > notes.md <<EOF
          Automated build of [\`${GITHUB_SHA::7}\`]($commit) on \`main\`, published after every test passed ([run]($run)).

          | Platform | File |
          | --- | --- |
          | macOS 13.4+ (Apple Silicon) | \`Bolum_${version}_aarch64.dmg\` |
          | Windows 10/11 (x64) | \`Bolum_${version}_x64-setup.exe\` |
          | Linux x86_64 (glibc 2.39+) | \`Bolum_${version}_amd64.AppImage\` |
          | Debian 13 / Ubuntu 24.04+ | \`Bolum_${version}_amd64.deb\` |

          \`SHA256SUMS.txt\` lists a checksum for each file. The apps are not code-signed yet, so see
          [Install](https://github.com/$GITHUB_REPOSITORY#install) for the first-launch steps.
          EOF
          # Recreate the rolling release so its tag and files always match this commit.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest release/* --target "$GITHUB_SHA" \
            --title "Bolum $version (latest build)" --notes-file notes.md --latest
